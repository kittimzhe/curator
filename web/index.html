<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curator — 你的 AI 图书管理员团队</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<script src="tailwind.js"></script>
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none;} }
  .pulse-dot { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1;} 50% { opacity: .3;} }
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<!-- Header -->
<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="text-2xl">🏛️</div>
    <div>
      <h1 class="text-lg font-bold tracking-wide">Curator</h1>
      <p class="text-xs text-slate-500">给你的数字大脑雇一队 AI 图书管理员</p>
    </div>
    <div class="ml-auto flex items-center gap-2 text-xs">
      <button id="tab-workbench" onclick="switchTab('workbench')" class="px-3 py-1 rounded-full bg-sky-600 text-white font-medium">🛠 工作台</button>
      <button id="tab-digest" onclick="switchTab('digest')" class="px-3 py-1 rounded-full bg-slate-800 text-slate-400">🌻 简报</button>
      <span id="llm-badge" class="px-2 py-1 rounded-full bg-slate-800 text-slate-400">…</span>
    </div>
  </div>
</header>

<div id="view-workbench">
<main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-5">

  <!-- Panel 1: Inbox -->
  <section class="space-y-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
      <h2 class="font-semibold mb-3 flex items-center gap-2">📥 收件箱</h2>
      <form id="inbox-form" class="space-y-2">
        <input id="f-title" required maxlength="200" placeholder="标题,如:LangGraph 状态管理详解"
               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-600">
        <input id="f-url" placeholder="来源 URL(可选)"
               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-600">
        <textarea id="f-content" rows="4" placeholder="粘贴内容……(长内容将触发深加工:摘要+互链+对抗审查)"
               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-600"></textarea>
        <button class="w-full bg-sky-600 hover:bg-sky-500 text-white rounded-lg py-2 text-sm font-medium transition">
          投递 → Agent 流水线
        </button>
      </form>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
      <h2 class="font-semibold mb-3">🗂️ 队列 <span id="item-count" class="text-xs text-slate-500"></span></h2>
      <div id="items" class="space-y-2 max-h-72 overflow-y-auto"></div>
    </div>
  </section>

  <!-- Panel 2: Agent Activity -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <h2 class="font-semibold mb-3 flex items-center gap-2">
      🤖 Agent 工作台
      <span class="pulse-dot text-[10px] text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded-full">LIVE</span>
    </h2>
    <p class="text-xs text-slate-500 mb-3">🏷️ 分类员 · 📝 摘要员 · 🔗 链接员 · ⚔️ 质疑员 · 📦 组装员</p>
    <div id="events" class="space-y-2 max-h-[560px] overflow-y-auto pr-1"></div>
  </section>

  <!-- Panel 3: Approvals -->
  <section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <h2 class="font-semibold mb-3">🕘 待审批 <span id="approval-count" class="text-xs text-amber-500"></span></h2>
    <div id="proposals" class="space-y-3 max-h-[560px] overflow-y-auto pr-1"></div>
  </section>
</main>

<!-- Vault footer -->
<footer class="max-w-7xl mx-auto px-4 pb-8">
  <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
    <h2 class="font-semibold mb-2 text-sm">📚 Vault(磁盘上的 Markdown,Obsidian 可直接打开)</h2>
    <div id="vault" class="flex flex-wrap gap-2"></div>
  </div>
</footer>
</div><!-- /view-workbench -->

<!-- ============ 简报视图 ============ -->
<div id="view-digest" class="hidden max-w-7xl mx-auto px-4 py-6 space-y-5">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="digest-cards"></div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
      <h2 class="font-semibold mb-3 flex items-center gap-2">🌻 园丁巡库
        <button onclick="runGardener()" class="ml-auto text-xs bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg">运行巡库</button>
      </h2>
      <div id="digest-findings" class="space-y-2"></div>
    </div>
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
      <h2 class="font-semibold mb-3">🏷️ 高频标签</h2>
      <div id="digest-tags" class="flex flex-wrap gap-2"></div>
      <p class="text-xs text-slate-600 mt-4">巡库发现的问题会列在左侧;双链建议会出现在工作台的审批队列中,批准后自动追加到既有笔记。</p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ITEM_STATUS = {
  pending:         ['排队中','bg-slate-800 text-slate-400'],
  processing:      ['Agent 处理中','bg-sky-950 text-sky-400'],
  awaiting_approval:['待审批','bg-amber-950 text-amber-400'],
  done:            ['已入库','bg-emerald-950 text-emerald-400'],
  rejected:        ['已拒绝','bg-rose-950 text-rose-400'],
  error:           ['出错','bg-rose-950 text-rose-400'],
};
const LEVEL_STYLE = { info:'', warn:'border-amber-800 bg-amber-950/30', debate:'border-violet-800 bg-violet-950/30' };

async function poll(){
  try {
    const r = await fetch('/api/state');
    render(await r.json());
  } catch(e) { /* server restarting */ }
}

function render(s){
  $('llm-badge').textContent = s.llm.mock ? 'LLM: MOCK 模式' : `LLM: ${s.llm.model}`;
  $('llm-badge').className = 'px-2 py-1 rounded-full ' + (s.llm.mock ? 'bg-amber-950 text-amber-400' : 'bg-emerald-950 text-emerald-400');

  // 队列
  $('item-count').textContent = `(${s.items.length})`;
  $('items').innerHTML = s.items.map(i => {
    const [label, cls] = ITEM_STATUS[i.status] || [i.status,'bg-slate-800'];
    return `<div class="flex items-center gap-2 text-sm bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 fade-in">
      <span class="truncate flex-1">${esc(i.title)}</span>
      <span class="text-[10px] px-2 py-0.5 rounded-full whitespace-nowrap ${cls}">${label}</span></div>`;
  }).join('') || '<p class="text-xs text-slate-600">空</p>';

  // 事件流
  $('events').innerHTML = s.events.map(e => {
    const time = new Date(e.created_at * 1000).toLocaleTimeString('zh-CN',{hour12:false});
    const cls = LEVEL_STYLE[e.level] || 'border-slate-800 bg-slate-950';
    return `<div class="text-xs border rounded-lg px-3 py-2 fade-in ${cls}">
      <div class="flex justify-between text-slate-500 mb-0.5"><span>${esc(e.agent)}</span><span>${time}</span></div>
      <div class="text-slate-300">「${esc(e.item_title)}」${esc(e.message)}</div></div>`;
  }).join('') || '<p class="text-xs text-slate-600">Agent 们待命中……投递内容后可以看到流水线实况</p>';

  // 提案
  const pending = s.proposals.filter(p => p.status==='pending');
  $('approval-count').textContent = pending.length ? `${pending.length} 条待处理` : '';
  $('proposals').innerHTML = s.proposals.map(p => {
    if (p.status==='pending') {
      return `<div class="border border-amber-900/60 bg-slate-950 rounded-lg p-3 fade-in">
        <div class="flex justify-between items-center mb-2 text-xs">
          <span class="text-amber-400 font-mono">#${p.id} → vault/${esc(p.filepath)}</span>
          <span class="${p.verdict==='pass'?'text-emerald-400':'text-violet-400'}">${p.verdict==='pass'?'✅ 审查通过':'⚔️ 质疑员存疑'}</span>
        </div>
        <pre class="text-[11px] leading-relaxed text-slate-400 whitespace-pre-wrap max-h-48 overflow-y-auto bg-slate-900 rounded-lg p-2 border border-slate-800">${esc(p.markdown)}</pre>
        <div class="flex gap-2 mt-2">
          <button onclick="act(${p.id},'approve')" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white rounded-lg py-1.5 text-xs font-medium">✅ 批准入库</button>
          <button onclick="act(${p.id},'reject')" class="flex-1 bg-slate-800 hover:bg-rose-900 text-slate-300 rounded-lg py-1.5 text-xs">🚫 拒绝</button>
        </div></div>`;
    }
    const [label, cls] = p.status==='approved' ? ['已入库','text-emerald-400'] : ['已拒绝','text-rose-400'];
    return `<div class="border border-slate-800 bg-slate-950/50 rounded-lg px-3 py-2 text-xs flex justify-between fade-in">
      <span class="font-mono text-slate-500">#${p.id} ${esc(p.filepath)}</span><span class="${cls}">${label}</span></div>`;
  }).join('') || '<p class="text-xs text-slate-600">暂无提案</p>';

  // vault
  $('vault').innerHTML = s.vault.map(f =>
    `<span class="text-xs bg-slate-950 border border-slate-800 rounded-full px-3 py-1 font-mono">📄 ${esc(f)}</span>`
  ).join('') || '<span class="text-xs text-slate-600">空</span>';
}

async function act(pid, action){
  await fetch(`/api/proposals/${pid}/${action}`, {method:'POST'});
  poll();
}

// ---------- 简报 ----------
function switchTab(tab){
  $('view-workbench').classList.toggle('hidden', tab !== 'workbench');
  $('view-digest').classList.toggle('hidden', tab !== 'digest');
  $('tab-workbench').className = 'px-3 py-1 rounded-full font-medium ' + (tab==='workbench' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-400');
  $('tab-digest').className = 'px-3 py-1 rounded-full font-medium ' + (tab==='digest' ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-400');
  if (tab === 'digest') fetchDigest();
}

async function fetchDigest(){
  try {
    const d = await (await fetch('/api/digest')).json();
    const cards = [
      ['📥 24h 投递', d.stats_24h.items, 'text-sky-400'],
      ['✅ 24h 入库', d.stats_24h.approved, 'text-emerald-400'],
      ['🕘 待审批', d.stats_24h.pending, 'text-amber-400'],
      ['📚 库存笔记', d.vault.total, 'text-violet-400'],
    ];
    $('digest-cards').innerHTML = cards.map(([label, val, cls]) => `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <div class="text-2xl font-bold ${cls}">${val}</div>
        <div class="text-xs text-slate-500 mt-1">${label}</div></div>`).join('');
    const ISSUE = {
      orphan: ['🏝️ 孤立','border-amber-900/60'],
      stale: ['⏳ 疑似过时','border-slate-700'],
      thin: ['🪶 薄弱','border-slate-700'],
    };
    $('digest-findings').innerHTML = d.findings.length
      ? d.findings.map(f => {
          const [label, cls] = ISSUE[f.type] || [f.type,'border-slate-700'];
          return `<div class="text-xs border rounded-lg px-3 py-2 bg-slate-950 ${cls}">
            <span class="font-medium">${label}</span>
            <span class="font-mono text-slate-400">${esc(f.note)}</span>
            <div class="text-slate-500 mt-0.5">${esc(f.detail)}</div></div>`;
        }).join('')
      : '<p class="text-xs text-emerald-400">🌻 巡库无异常,知识库健康</p>';
    $('digest-tags').innerHTML = d.top_tags.length
      ? d.top_tags.map(t => `<span class="text-xs bg-slate-950 border border-slate-800 rounded-full px-3 py-1">${esc(t.tag)} <span class="text-slate-500">×${t.count}</span></span>`).join('')
      : '<p class="text-xs text-slate-600">暂无标签</p>';
  } catch(e) {}
}

async function runGardener(){
  const r = await (await fetch('/api/garden/run', {method:'POST'})).json();
  alert(`🌻 巡库完成:${r.total_notes} 篇笔记,${r.findings.length} 个发现,新建 ${r.proposals_created} 条双链提案(去工作台审批)`);
  fetchDigest();
}

$('inbox-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = { title: $('f-title').value.trim(), url: $('f-url').value.trim(), content: $('f-content').value };
  if (!body.title) return;
  await fetch('/api/inbox', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  e.target.reset();
  poll();
});

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
