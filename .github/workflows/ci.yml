name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 端到端冒烟测试(MOCK 模式)
        env:
          CURATOR_LLM_MOCK: "1"
        run: python scripts/smoke_test.py

      - name: 嵌入模型缓存(加速检索检查)
        uses: actions/cache@v4
        with:
          path: data/chroma_models
          key: onnx-minilm-${{ runner.os }}
